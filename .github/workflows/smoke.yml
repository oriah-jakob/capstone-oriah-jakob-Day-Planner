name: Deployment smoke test

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployed URL to test
        required: true
        type: string
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    name: Playwright smoke test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Per-deployment URLs sit behind Vercel's login; the production domain is public.
      PLAYWRIGHT_BASE_URL: ${{ inputs.target || vars.PRODUCTION_URL }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 14
